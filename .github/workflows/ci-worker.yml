name: Worker Validation

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/ci-worker.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/ci-worker.yml"
  # Manual trigger for PRs whose base branch predates this workflow (stacked PRs)
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate (checks out the PR head)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # On manual dispatch, validate the PR's head instead of main
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --dry-run bundles the worker with esbuild and validates wrangler.toml
      # without needing Cloudflare credentials — catches syntax errors,
      # bad imports, and config mistakes before deploy
      - name: Validate worker bundle
        run: npx wrangler deploy --dry-run --outdir=dist
