name: Worker Validation

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/ci-worker.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/ci-worker.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --dry-run bundles the worker with esbuild and validates wrangler.toml
      # without needing Cloudflare credentials — catches syntax errors,
      # bad imports, and config mistakes before deploy
      - name: Validate worker bundle
        run: npx wrangler deploy --dry-run --outdir=dist
