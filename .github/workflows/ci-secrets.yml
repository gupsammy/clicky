name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger for PRs whose base branch predates this workflow (stacked PRs)
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to scan (checks out the PR head)"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so gitleaks can scan every commit in the PR,
          # not just the final tree state
          fetch-depth: 0
          # On manual dispatch, scan the PR's head instead of main
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dispatched runs aren't attached to the PR, so surface the result as a
      # commit status on the PR head — that's what the PR checks box reads
      - name: Report result on PR head commit (manual dispatch only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/$(git rev-parse HEAD) \
            -f state="${{ job.status == 'success' && 'success' || 'failure' }}" \
            -f context="Secret Scan (manual)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
