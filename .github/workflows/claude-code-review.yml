name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # Manual trigger for PRs whose base branch predates this workflow (e.g. stacked
  # PRs based on other feature branches) — pull_request events read the workflow
  # from the merge ref (head + base), so those PRs never see this file
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

jobs:
  claude-review:
    # Skip draft PRs — reviews run once a PR is opened as ready or marked ready-for-review
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write   # Post inline review comments and the summary comment
      id-token: write        # Required for OAuth token auth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # On manual dispatch, review against the PR's actual tree, not main
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      # Large PR diffs overflow Claude's Bash output limit and strand the review
      # in denied workarounds — hand it the diff as a file it can Read in chunks
      - name: Materialize PR diff (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ inputs.pr_number }} > pr-review-diff.patch
          wc -l pr-review-diff.patch

      - name: Install Claude Code
        run: mkdir -p ~/.local/bin && npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        # On workflow_dispatch the action has no PR context, so Claude's gh
        # commands need explicit credentials to post the review
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress needs a PR event context; disabled for manual dispatch
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            Review PR #${{ inputs.pr_number || github.event.pull_request.number }} in ${{ github.repository }}.

            ## Phase 1 — Context Discovery
            Read CLAUDE.md for the architecture and conventions: this is a menu-bar-only
            macOS app (SwiftUI + AppKit bridging, MVVM, @MainActor isolation) where all
            external API calls are proxied through a Cloudflare Worker (worker/src/index.ts)
            that holds the secrets. Get the full diff, then categorize changed files:
            Swift app sources, Cloudflare Worker, Xcode project config (project.pbxproj,
            Info.plist), docs, CI.

            Where to get the diff and code:
            - Manual dispatch run: the checkout IS the PR head, and the complete diff is
              already at pr-review-diff.patch in the repository root — Read it (in
              chunks if large). Do NOT run gh pr diff, git fetch, or redirect output to
              files; those are unavailable. Read source files directly from the checkout.
              Work strictly inline and synchronously: never launch subagents, background
              tasks, or scheduled wakeups — this run terminates the moment your main
              turn ends, so any work you delegate or defer is silently lost. However
              large the diff, read it chunk by chunk yourself and write the review
              before you finish.
            - pull_request-triggered run: run `gh pr diff` as usual.

            ## Phase 2 — Change Comprehension
            Summarize the PR's intent in one sentence. Read the surrounding code, not just
            the diff — especially CompanionManager.swift (the central state machine) when
            the change touches the voice pipeline. Identify the existing patterns the change
            should follow (transcription-provider protocol, DS design tokens, shared
            URLSession for AssemblyAI) before critiquing anything.

            ## Phase 3 — Deep Analysis
            Evaluate the diff against these dimensions:

            - Correctness & concurrency: @MainActor violations, races in the push-to-talk
              state machine (idle/listening/processing/responding), retain cycles in
              closures bridging AppKit and SwiftUI, websocket lifecycle bugs.
            - Security: any API key or secret landing in the app bundle, Swift source, or
              build settings — everything sensitive must stay on the Cloudflare Worker.
              Input validation on Worker routes. Screenshot or audio data leaving the app
              through anything other than the Worker proxy.
            - Error handling: silent failures in async pipelines (transcription, TTS,
              screen capture), missing permission-denied paths (microphone, screen
              recording, accessibility/TCC).
            - API & interface: changes to Worker route contracts (/chat, /tts,
              /transcribe-token) that would break the app, and changes to the
              [POINT:x,y:label:screenN] tag protocol between Claude responses and the
              cursor overlay.
            - Performance: main-thread blocking in audio or capture hot paths, and
              per-session URLSession creation — the AssemblyAI URLSession must stay
              shared across sessions (known landmine documented in CLAUDE.md).
            - Maintainability: CLAUDE.md's naming convention (clarity over concision, no
              abbreviated names, props passed with their original names), over-engineering,
              dead code. Do NOT flag the known Swift 6 concurrency warnings, the deprecated
              onChange in OverlayWindow.swift, or the intentional "leanring" typo in the
              project name.

            ## Phase 4 — Output
            If the mcp__github_inline_comment__create_inline_comment tool is available,
            post inline comments on specific lines. If it is NOT available (manual
            dispatch runs), do not attempt inline comments — include every finding
            with its file path and line number in the summary instead.

            Classify findings by severity:
            - 🔴 Must fix — bugs, security vulnerabilities, data loss risks
            - 🟡 Should fix — error handling gaps, performance issues, API design concerns
            - 🟢 Suggestion — alternative approaches, minor optimizations, readability wins
            - ❓ Question — clarification needed, intent unclear, design choice to discuss

            Then produce a single top-level summary with: a one-sentence PR summary,
            an overall assessment, key findings grouped by severity, and positive callouts
            for well-written code. If no issues are found, say so — don't manufacture
            feedback.

            How to deliver the summary:
            - Manual dispatch run: you MUST create the file review-output.md (exactly
              that name, at the repository root) containing the complete review
              markdown, using the Write tool — NOT a Bash redirect, NOT any other path.
              Do this even if you found zero issues. This is the only delivery channel:
              if the file does not exist when you finish, the entire review is lost and
              the run fails. Do NOT try to post the review yourself.
            - pull_request-triggered run: post it as a top-level PR comment as usual.
          claude_args: |
            --model sonnet
            --allowedTools "Read,Write,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      # Surfaces what Claude actually did (tool calls, denials, errors) — the
      # streamed log only shows init/result, which makes silent failures undebuggable
      - name: Debug — dump Claude tool activity (manual dispatch only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$f" ]; then
            echo "--- tool calls ---"
            jq -r '.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | "\(.name): \((.input.command // .input.file_path // .input.pattern // "") | tostring | .[0:150])"' "$f" | head -60
            echo "--- errored tool results ---"
            jq -r '.[] | select(.type == "user") | .message.content[]? | select(.type == "tool_result" and .is_error == true) | (.content | tostring | .[0:250])' "$f" | head -40
          else
            echo "no execution output found at $f"
          fi

      # Posting is deterministic on dispatch runs: Claude writes review-output.md,
      # this step posts it. Fails loudly if the review never materialized so a
      # silent no-op run can't show green.
      - name: Post review comment (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tolerate the file landing in a subdirectory despite instructions
          review_file=$(find . -maxdepth 3 -name review-output.md -not -path './.git/*' | head -1)
          if [ -n "$review_file" ]; then
            gh pr comment ${{ inputs.pr_number }} --body-file "$review_file"
          else
            echo "::error::Claude finished without writing review-output.md — review was not posted"
            exit 1
          fi
