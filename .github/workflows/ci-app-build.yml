name: App Build

on:
  pull_request:
    paths:
      - "**/*.swift"
      - "leanring-buddy/**"
      - "leanring-buddy.xcodeproj/**"
      - ".github/workflows/ci-app-build.yml"
  push:
    branches: [main]
    paths:
      - "**/*.swift"
      - "leanring-buddy/**"
      - "leanring-buddy.xcodeproj/**"
      - ".github/workflows/ci-app-build.yml"
  # Manual trigger for PRs whose base branch predates this workflow (stacked PRs)
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build (checks out the PR head)"
        required: true
        type: string

# Rapid pushes to the same branch cancel the previous in-flight build —
# macOS runner minutes are the expensive resource here
concurrency:
  group: app-build-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # On manual dispatch, build the PR's head instead of main
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy

      # CODE_SIGNING_ALLOWED=NO: CI has no signing identity; we only care
      # that the code compiles, not that the .app is distributable
      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
