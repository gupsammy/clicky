name: App Build

on:
  pull_request:
    paths:
      - "**/*.swift"
      - "leanring-buddy/**"
      - "leanring-buddy.xcodeproj/**"
      - ".github/workflows/ci-app-build.yml"
  push:
    branches: [main]
    paths:
      - "**/*.swift"
      - "leanring-buddy/**"
      - "leanring-buddy.xcodeproj/**"
      - ".github/workflows/ci-app-build.yml"
  # Manual trigger for PRs whose base branch predates this workflow (stacked PRs)
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build (checks out the PR head)"
        required: true
        type: string

# Rapid pushes to the same branch cancel the previous in-flight build —
# macOS runner minutes are the expensive resource here
concurrency:
  group: app-build-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # On manual dispatch, build the PR's head instead of main
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      # Older branches predate the shared scheme (schemes used to live only in
      # untracked xcuserdata) — borrow it from main so xcodebuild can find it
      - name: Restore shared scheme if branch predates it
        run: |
          if [ ! -f "leanring-buddy.xcodeproj/xcshareddata/xcschemes/leanring-buddy.xcscheme" ]; then
            git fetch --depth=1 origin main
            git checkout FETCH_HEAD -- leanring-buddy.xcodeproj/xcshareddata
          fi

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy

      # CODE_SIGNING_ALLOWED=NO: CI has no signing identity; we only care
      # that the code compiles, not that the .app is distributable
      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      # Dispatched runs aren't attached to the PR, so surface the result as a
      # commit status on the PR head — that's what the PR checks box reads
      - name: Report result on PR head commit (manual dispatch only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/$(git rev-parse HEAD) \
            -f state="${{ job.status == 'success' && 'success' || 'failure' }}" \
            -f context="App Build (manual)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
